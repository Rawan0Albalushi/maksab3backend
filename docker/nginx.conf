server {
    listen __PORT__;
    server_name _;
    # The panel builds asset URLs from the project root (/public/assets,
    # /storage/app/public), so that directory is the web root.
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /public/assets/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ^~ /storage/app/public/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ^~ /vendor/ { deny all; }
    location ^~ /bootstrap/ { deny all; }
    location ^~ /app/ { deny all; }
    location ^~ /config/ { deny all; }
    location ^~ /database/ { deny all; }
    location ^~ /routes/ { deny all; }
    location ^~ /resources/ { deny all; }
    location ^~ /tests/ { deny all; }
    location ^~ /docker/ { deny all; }
    location ^~ /installation/ { deny all; }
    location ^~ /storage/ { deny all; }

    location ^~ /Modules/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    location ~* \.(env|sql|md|ya?ml|lock|ini|sh|conf)$ {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 120;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
